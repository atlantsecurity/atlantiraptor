name: Cloud.Okta.PasswordSpray
description: |
  Hunts Okta sign-in failures for password guessing:

  - **high**: password spraying, one address failing against many
    accounts.
  - **critical**: an account then signed in successfully from a
    spraying address.
  - **medium**: brute force, many failures against one account;
    **high** when the account then signed in successfully from one of
    the guessing addresses.

  Needs an API token of a Read-only Administrator.

type: SERVER

parameters:
  - name: OktaSecret
    description: Name of the "Okta Creds" secret for the organisation.
  - name: LookbackHours
    type: int
    default: 72
  - name: SprayMinUsers
    type: int
    default: 10
    description: Distinct accounts one address must fail against.
  - name: BruteMinFailures
    type: int
    default: 20
    description: Failures against one account.
  - name: FailureReasons
    type: regex
    default: "(?i)INVALID_CREDENTIALS|VERIFICATION_ERROR|LOCKED_OUT|INVALID_PASSWORD"

sources:
  - query: |
      LET Sessions <= SELECT timestamp(string=Time) AS Time,
             timestamp(string=Time).Unix AS Epoch,
             Result, Reason, Actor AS User, IPAddress, Location, Device,
             UserAgent, ASOrg
      FROM okta_logs(secret=OktaSecret, start=now() - LookbackHours * 3600,
                     filter='''eventType eq "user.session.start"''')
      WHERE EventType = "user.session.start"

      LET Failures <= SELECT * FROM Sessions
          WHERE Result = "FAILURE" AND Reason =~ FailureReasons
      LET Successes <= SELECT * FROM Sessions WHERE Result =~ "^(SUCCESS|ALLOW)$"

      // Spraying: many accounts from one address.
      LET PerAddressUser <= SELECT IPAddress, User, min(item=Epoch) AS First,
             Location, ASOrg
          FROM Failures GROUP BY IPAddress, User
      LET Sprayers <= SELECT IPAddress, count() AS Users, enumerate(items=User) AS Targets,
             min(item=First) AS First, Location, ASOrg
          FROM PerAddressUser GROUP BY IPAddress
      LET SprayIPs <= to_dict(item={
          SELECT IPAddress AS _key, Users AS _value FROM Sprayers WHERE Users >= SprayMinUsers })

      LET Spray = SELECT timestamp(epoch=First) AS Time, "high" AS Severity,
             "Password spray from this address" AS Detection,
             format(format="%v accounts", args=Users) AS User, IPAddress, Location,
             "" AS Device, dict(Accounts=Targets, ASOrg=ASOrg) AS Details
      FROM Sprayers WHERE Users >= SprayMinUsers

      LET SprayThenSuccess = SELECT Time, "critical" AS Severity,
             "Successful sign-in from a password-spraying address" AS Detection,
             User, IPAddress, Location, Device,
             dict(AccountsSprayed=get(item=SprayIPs, field=IPAddress),
                  ASOrg=ASOrg, UserAgent=UserAgent) AS Details
      FROM Successes
      WHERE get(item=SprayIPs, field=IPAddress)
      GROUP BY User, IPAddress

      // Brute force: many failures against one account.
      LET PerUserAddress <= SELECT User, IPAddress, count() AS N,
             min(item=Epoch) AS First, max(item=Epoch) AS Last
          FROM Failures GROUP BY User, IPAddress
      LET PerUser <= SELECT User, sum(item=N) AS Failures, enumerate(items=IPAddress) AS Addresses,
             min(item=First) AS First, max(item=Last) AS Last
          FROM PerUserAddress GROUP BY User
      LET Brute <= SELECT * FROM PerUser WHERE Failures >= BruteMinFailures
      LET BruteUsers <= to_dict(item={
          SELECT User AS _key, dict(Failures=Failures, Addresses=Addresses, First=First) AS _value
          FROM Brute })

      LET BruteForce = SELECT timestamp(epoch=First) AS Time, "medium" AS Severity,
             "Brute force against one account" AS Detection,
             User, join(array=Addresses, sep=", ") AS IPAddress, "" AS Location,
             "" AS Device,
             dict(Failures=Failures, Addresses=Addresses,
                  LastFailure=timestamp(epoch=Last)) AS Details
      FROM Brute

      LET BruteThenSuccess = SELECT Time, "high" AS Severity,
             "Successful sign-in after brute force" AS Detection,
             User, IPAddress, Location, Device,
             dict(Failures=get(item=BruteUsers, field=User).Failures,
                  UserAgent=UserAgent, ASOrg=ASOrg) AS Details
      FROM Successes
      WHERE get(item=BruteUsers, field=User)
        AND Epoch >= get(item=BruteUsers, field=User).First
        AND IPAddress in get(item=BruteUsers, field=User).Addresses
      GROUP BY User, IPAddress

      SELECT * FROM chain(a=Spray, b=SprayThenSuccess, c=BruteForce, d=BruteThenSuccess)
