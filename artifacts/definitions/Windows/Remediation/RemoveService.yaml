name: Windows.Remediation.RemoveService
description: |
  Stops and deletes Windows services whose name or binary path matches
  a regex, for example a malicious persistence service.

  Without `ReallyDoIt` the artifact only lists the services it would
  remove. The agent's own service is never touched.

  WARNING: deleting the wrong service can break the host. Test the regex
  with a dry run before deploying widely.

type: CLIENT

required_permissions:
  - EXECVE

precondition: SELECT OS From info() where OS = 'windows'

parameters:
  - name: ServiceRegex
    type: regex
    default: ThisIsAUniqueName
    description: Matched against the service name and its binary path.
  - name: ReallyDoIt
    type: bool
    description: Stop and delete the matching services. Otherwise only list them.

sources:
  - query: |
      // The agent's own service is identified by its exact binary path
      // or process ID, not by name, so look-alike services are not hidden.
      LET me <= SELECT Exe FROM info()
      LET agent_pid <= getpid()
      LET agent_exe <= lowcase(string=me[0].Exe)

      // The executable part of PathName: the quoted path, or everything up
      // to the first ".exe" when unquoted. Arguments are dropped so they
      // cannot be used to look like the agent.
      LET exe_of(p) = lowcase(string=regex_replace(source=p,
          re='''(?i)^\s*(?:"([^"]+)"|(\S.*?\.exe)\b).*$''', replace="$1$2"))

      LET services = SELECT Name, DisplayName, PathName, State, StartMode,
             ProcessId = agent_pid OR exe_of(p=PathName) = agent_exe AS IsAgent
        FROM wmi(query="SELECT Name, DisplayName, PathName, State, StartMode, ProcessId FROM Win32_Service",
                 namespace="ROOT/CIMV2")
        WHERE Name =~ ServiceRegex OR PathName =~ ServiceRegex

      LET run(argv) = SELECT ReturnCode, Stdout FROM execve(argv=argv)

      SELECT Name, DisplayName, PathName, State, StartMode,
             if(condition=ReallyDoIt AND NOT IsAgent,
                then=run(argv=["sc.exe", "stop", Name])[0].ReturnCode) AS StopCode,
             if(condition=IsAgent, then="Skipped (agent)",
                else=if(condition=ReallyDoIt,
                   then=if(condition=run(argv=["sc.exe", "delete", Name])[0].ReturnCode = 0,
                           then="Deleted", else="Failed"),
                   else="Dry run")) AS Result
      FROM services
