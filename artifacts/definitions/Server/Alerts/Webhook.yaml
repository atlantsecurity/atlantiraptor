name: Server.Alerts.Webhook
description: |
  Forwards alerts from `Server.Internal.Alerts` to a chat or webhook
  endpoint: Slack, Microsoft Teams, Discord, or any service that
  accepts JSON.

  The endpoint URL (and any auth headers) live in an `HTTP Secrets`
  secret, so no token is stored in this artifact's parameters. Create
  the secret with the webhook URL in `url` and method `POST`.

type: SERVER_EVENT

parameters:
  - name: Secret
    description: Name of an HTTP Secrets secret holding the webhook URL.
  - name: Format
    type: choices
    default: slack
    choices: [slack, teams, discord, generic]
  - name: MinLevel
    type: choices
    default: medium
    choices: [critical, high, medium, low, info]
    description: Only forward alerts at this severity or worse.

sources:
  - query: |
      // linter: symbol_mask_warn:timestamp

      LET rank <= dict(critical=0, high=1, medium=2, low=3, info=4, informational=4)
      LET min_rank <= get(item=rank, field=MinLevel, default=2)

      LET level_of(e) = lowcase(string=e.level || "medium")

      LET text_of(name, client_id, level, e, ts) = format(
          format="[%v] %v on %v: %v (%v)",
          args=[upcase(string=level), name, client_id || "server", e.description || "", ts])

      LET body(name, client_id, level, e, ts, artifact) = if(
          condition=Format = "generic",
          then=dict(name=name, client_id=client_id, level=level, artifact=artifact,
                    timestamp=ts, event_data=e),
          else=if(condition=Format = "discord",
             then=dict(content=text_of(name=name, client_id=client_id, level=level, e=e, ts=ts)),
             else=dict(text=text_of(name=name, client_id=client_id, level=level, e=e, ts=ts))))

      LET alerts = SELECT * FROM watch_monitoring(artifact="Server.Internal.Alerts")
        WHERE get(item=rank, field=level_of(e=event_data), default=2) <= min_rank

      SELECT * FROM foreach(row=alerts, query={
        SELECT name AS Alert, client_id AS ClientId, Response, Content
        FROM http_client(
          secret=Secret,
          method="POST",
          headers=dict(`Content-Type`="application/json"),
          data=serialize(format="json",
            item=body(name=name, client_id=client_id, level=level_of(e=event_data),
                      e=event_data, ts=timestamp, artifact=artifact)))
      })
