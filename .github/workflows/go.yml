# Runs Linux tests on every push and pull request. The full
# multi-architecture build runs on pushes to master and on demand.
name: Linux Build and Test
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Linux Test
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

    - name: Set up Go 1.27
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
      with:
        go-version: '^1.27.2'
        cache: false

    - run: go version

    # Generates the fileb0x ab0x.go files (artifacts, config, gui,
    # crypto) that are gitignored but required to compile.
    - name: Generate assets
      run: go run make.go -v BasicAssets

    - name: Build
      env:
        CGO_ENABLED: "0"
      run: go build -tags "server_vql extras" -o ./output/velociraptor ./bin/

    - name: Test
      env:
        # Disable CGO for tests, matching the Windows workflow.
        CGO_ENABLED: "0"
      run: |
        # Only run short tests on CI because the CI machines are slow
        go test -short ./... --tags "velomain server_vql" -p 2

  build:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: Build All Arches
    runs-on: ubuntu-latest
    steps:

    - name: Check out code into the Go module directory
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

    - name: Set up Go 1.27
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
      with:
        go-version: '^1.27.2'

        # Caching seems to really slow down the build due to the time
        # taken to save the cache.
        cache: false

    - run: go version

    - name: Use Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e

    - name: npm install gui
      run: |
            cd gui/velociraptor/
            npm install
            npm run build
            cd ../../

    - name: Build All Architectures
      # Uncomment the architectures you want here. NOTE: DarwinBase
      # does not include yara or modules with C compilers needed.
      run: |
        mkdir ./output/
        export PATH=$PATH:~/go/bin/
        go run make.go -v UpdateDependentTools
        go run make.go -v DarwinBase
        go run make.go -v Windows
        go run make.go -v WindowsSumo
        go run make.go -v WindowsArm64

    - name: StoreBinaries
      uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
      with:
        name: Binaries
        path: output
