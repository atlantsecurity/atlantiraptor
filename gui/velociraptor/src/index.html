<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="shortcut icon" href="{{.BasePath}}/app/favicon.ico" />
    <script type="text/javascript">
      window.globals = {
          'debug': false,
          'lang': 'en',
          'theme': "{{.UserTheme}}",
          'base_path': "{{.BasePath}}",
          'OrgId': "{{.OrgId}}",
      };
      window.base_path = "{{.BasePath}}";
      /// Support development
      if (window.base_path.substring(0,2) === "\{\{") {
          window.base_path = "/";
          window.globals.base_path = window.base_path;
      }

      // Set the OrgId from the URL if possible.
      let url = new URL(window.location.href)
      if (url.searchParams.get("org_id")) {
          window.globals.OrgId = url.searchParams.get("org_id");
      }

    </script>
    <script type="text/javascript">
      // Used to launch the application in an error state - allows the
      // user to interact with the react web app without being logged in.
      window.ErrorState = {{ if .ErrState -}}
        JSON.parse({{.ErrState}});
      {{- else -}}
      []
      {{- end -}};
    </script>

    <title>Velociraptor Response and Monitoring</title>
  </head>
  <body id="body" class="{{.UserTheme}}">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!-- Shown until the app renders (React replaces #root's content). -->
    <div id="root"><div id="atl-boot" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:14px system-ui,sans-serif;color:#8a94a6;background:inherit">
      <div style="text-align:center">
        <div>Loading Atlantiraptor…</div>
        <div id="atl-boot-slow" style="display:none;margin-top:8px;font-size:12px;max-width:360px">
          This is taking longer than usual. The server may be busy or restarting; the page will continue on its own.
          <a href="" style="color:inherit;text-decoration:underline">Reload</a>
        </div>
      </div>
    </div></div>
    <script>
      setTimeout(function () {
        var el = document.getElementById('atl-boot-slow');
        if (el) el.style.display = 'block';
      }, 6000);
    </script>
    <!-- Note: magefile.go will mutate the vite geneated code to rebase on base_path -->
    <script type="module" src="./index.jsx"></script>
  </body>
</html>
